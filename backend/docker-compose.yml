version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: expense-tracker-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "6543:6543"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: